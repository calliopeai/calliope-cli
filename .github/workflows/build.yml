name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'scripts/verify-runlog.mjs'
      - '.github/workflows/build.yml'
  # Triggered by publish.yml after a new npm release — ensures the Docker image
  # always reflects the latest published CLI version
  workflow_run:
    workflows: ['Publish to npm']
    types: [completed]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: calliope-cli

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip if triggered by a failed workflow_run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get CLI version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:sha-${{ steps.sha.outputs.short }}
            ${{ github.event_name == 'workflow_run' && format('{0}/{1}:v{2}', steps.login-ecr.outputs.registry, env.ECR_REPOSITORY, steps.version.outputs.version) || '' }}
          cache-from: type=gha,scope=calliope-cli
          cache-to: type=gha,mode=max,scope=calliope-cli
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Tag :stable
        if: github.event_name == 'workflow_run'
        run: |
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=sha-${{ steps.sha.outputs.short }} \
            --query 'images[0].imageManifest' --output text)
          aws ecr put-image \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-tag stable \
            --image-manifest "$MANIFEST"
          echo "Tagged sha-${{ steps.sha.outputs.short }} as :stable"

      - name: Summary
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.sha.outputs.short }}
        run: |
          {
            echo "## Calliope AI CLI image"
            echo "Source commit: $SHA"
            echo "Development tags: $REGISTRY:latest and $REGISTRY:sha-$SHA"
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
              echo "Verified npm release promotion: $REGISTRY:v$VERSION and $REGISTRY:stable"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
