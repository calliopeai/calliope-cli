name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    # Stacked foundation PRs must pass the same gates before their base merges.
    branches: [main, 'feat/**', 'fix/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run tests
        # Keep worker contention bounded; the release gate uses the same limit.
        run: npm test -- --maxWorkers=2

      - name: Check types
        run: npx tsc --noEmit

  bench:
    # Performance budgets (issue #186). Runs after build/test so a red build
    # fails fast before we spend time benchmarking.
    needs: build
    runs-on: ubuntu-latest

    # CI runners are slower and noisier than a dev laptop. CALLIOPE_BENCH_CI=1
    # doubles the TIME budgets (cold start, keystroke) so the gate catches real
    # regressions (2x+ slowdowns) rather than runner jitter. Memory budgets are
    # deterministic and are NOT scaled. See docs/performance.md.
    env:
      CALLIOPE_BENCH_CI: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run performance benches (builds, then gates all budgets)
        run: npm run bench

  binary:
    name: Binary smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: npm ci
      - run: npm run build
      - run: bun packaging/build-binary.mjs --native
      - name: Exercise the standalone artifact
        run: node scripts/release/binary-smoke.mjs packaging/dist/calliope-native "$(node -p "require('./package.json').version")"
