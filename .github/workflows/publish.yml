name: Publish to npm
on:
  release:
    types: [published]
  # Dispatch on an existing version TAG, never a branch. No version mutation.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/release-checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.checks.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Recheck publisher source identity
        id: version
        run: node scripts/release/source.mjs
      - run: npm ci
      - name: Publish exact tagged source with provenance
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            npm publish --provenance --access public --tag alpha
          else
            npm publish --provenance --access public
          fi
      - name: Trigger desktop rebuild
        if: steps.version.outputs.prerelease == 'false'
        run: |
          echo "Triggering desktop rebuild for calliope-cli v${{ steps.version.outputs.version }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_CALLIOPE_CI }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/calliopeai/calliope-desktop/dispatches \
            -d '{"event_type":"cli-published","client_payload":{"version":"${{ steps.version.outputs.version }}"}}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          if [ -n "$BODY" ]; then
            echo "Response: $BODY"
          fi

          if [ "$HTTP_CODE" != "204" ]; then
            echo "::warning::Failed to trigger desktop rebuild (HTTP $HTTP_CODE) — not blocking publish"
          else
            echo "Successfully triggered desktop rebuild"
          fi

      - name: Trigger calliope-agents rebuild
        if: steps.version.outputs.prerelease == 'false'
        run: |
          echo "Triggering calliope-agents rebuild for calliope runtime v${{ steps.version.outputs.version }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_CALLIOPE_CI }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/calliopeai/calliope-agents/dispatches \
            -d '{"event_type":"cli-published","client_payload":{"version":"${{ steps.version.outputs.version }}","runtime":"calliope"}}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          if [ -n "$BODY" ]; then
            echo "Response: $BODY"
          fi

          if [ "$HTTP_CODE" != "204" ]; then
            echo "::warning::Failed to trigger calliope-agents rebuild (HTTP $HTTP_CODE) — not blocking publish"
          else
            echo "Successfully triggered calliope-agents rebuild"
          fi

      - name: Trigger agterm update
        if: steps.version.outputs.prerelease == 'false'
        run: |
          echo "Triggering agterm update for version ${{ steps.version.outputs.version }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_CALLIOPE_CI }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/calliopeai/calliope-agterm/dispatches \
            -d '{"event_type":"cli-published","client_payload":{"version":"${{ steps.version.outputs.version }}"}}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          if [ -n "$BODY" ]; then
            echo "Response: $BODY"
          fi

          if [ "$HTTP_CODE" != "204" ]; then
            echo "::error::Failed to trigger agterm update (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Successfully triggered agterm update"
