name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major) or specific version'
        required: false
        default: 'patch'
      publish_current:
        description: 'Publish the current package.json version without bumping'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Clean git state
        if: github.event_name == 'workflow_dispatch'
        run: |
          git checkout -- .
          git clean -fd

      - name: Install dependencies
        run: npm ci

      - name: Bump version (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_current
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.version }} -m "Release v%s"
          git push --follow-tags

      - name: Publish to npm
        run: npm publish --access public

      - name: Get published version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Trigger desktop rebuild
        run: |
          echo "Triggering desktop rebuild for calliope-cli v${{ steps.version.outputs.version }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_CALLIOPE_CI }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/calliopeai/calliope-desktop/dispatches \
            -d '{"event_type":"cli-published","client_payload":{"version":"${{ steps.version.outputs.version }}"}}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          if [ -n "$BODY" ]; then
            echo "Response: $BODY"
          fi

          if [ "$HTTP_CODE" != "204" ]; then
            echo "::warning::Failed to trigger desktop rebuild (HTTP $HTTP_CODE) — not blocking publish"
          else
            echo "Successfully triggered desktop rebuild"
          fi

      - name: Trigger agterm update
        run: |
          echo "Triggering agterm update for version ${{ steps.version.outputs.version }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_CALLIOPE_CI }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/calliopeai/calliope-agterm/dispatches \
            -d '{"event_type":"cli-published","client_payload":{"version":"${{ steps.version.outputs.version }}"}}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          if [ -n "$BODY" ]; then
            echo "Response: $BODY"
          fi

          if [ "$HTTP_CODE" != "204" ]; then
            echo "::error::Failed to trigger agterm update (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Successfully triggered agterm update"
