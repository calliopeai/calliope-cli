name: Release binaries
on:
  release:
    types: [published]
  # Manual main-branch runs create CI preview artifacts only, never release assets.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/release-checks.yml
    with:
      preview: ${{ github.event_name == 'workflow_dispatch' }}
  build:
    needs: checks
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-darwin-arm64, asset: darwin-arm64, os: macos-14 }
          - { target: bun-darwin-x64, asset: darwin-x64, os: macos-15-intel }
          - { target: bun-linux-x64, asset: linux-x64, os: ubuntu-24.04 }
          - { target: bun-linux-arm64, asset: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: npm ci
      - run: npm run build
      - name: Compile and smoke the native artifact
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          bun packaging/build-binary.mjs --target "$TARGET"
          node scripts/release/binary-smoke.mjs "packaging/dist/calliope-$ASSET" "$VERSION"
          mkdir out
          cp "packaging/dist/calliope-$ASSET" "out/calliope-$VERSION-$ASSET"
          cd out
          shasum -a 256 "calliope-$VERSION-$ASSET" > "calliope-$VERSION-$ASSET.sha256"
      - name: Attest the binary
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/calliope-${{ needs.checks.outputs.version }}-${{ matrix.asset }}
      - name: Retain and verify the signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.checks.outputs.version }}
          SOURCE_REF: ${{ needs.checks.outputs.ref }}
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        run: |
          file="out/calliope-$VERSION-$ASSET"
          cp "$BUNDLE" "$file.sigstore.json"
          gh attestation verify "$file" --bundle "$file.sigstore.json" --repo calliopeai/calliope-cli \
            --signer-workflow calliopeai/calliope-cli/.github/workflows/release-binaries.yml \
            --source-ref "$SOURCE_REF" --source-digest "$SOURCE_SHA" --deny-self-hosted-runners
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: out
          merge-multiple: true
      - name: Validate all four artifacts and assemble manifest
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ needs.checks.outputs.ref }}
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        run: node scripts/release/assemble.mjs out "$VERSION"
      - name: Attest the complete checksum manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/checksums.txt
      - name: Retain and verify manifest provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SOURCE_REF: ${{ needs.checks.outputs.ref }}
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        run: |
          cp "$BUNDLE" out/checksums.txt.sigstore.json
          gh attestation verify out/checksums.txt --bundle out/checksums.txt.sigstore.json --repo calliopeai/calliope-cli \
            --signer-workflow calliopeai/calliope-cli/.github/workflows/release-binaries.yml \
            --source-ref "$SOURCE_REF" --source-digest "$SOURCE_SHA" --deny-self-hosted-runners
      - name: Retain the verified CI artifact set
        uses: actions/upload-artifact@v4
        with:
          name: verified-binaries-${{ needs.checks.outputs.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - name: Attach only after every artifact passed
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: gh release upload "$TAG" out/* --repo calliopeai/calliope-cli
