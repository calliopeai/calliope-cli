name: Release binaries
on:
  release:
    types: [published]
  # Manual main-branch runs create CI preview artifacts only, never release assets.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/release-checks.yml
    with:
      preview: ${{ github.event_name == 'workflow_dispatch' }}
  build:
    needs: checks
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    # Notarisation waits on Apple's service.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        # Git Bash on Windows, so every platform runs the same steps.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-darwin-arm64, asset: darwin-arm64, os: macos-14 }
          - { target: bun-darwin-x64, asset: darwin-x64, os: macos-15-intel }
          - { target: bun-linux-x64, asset: linux-x64, os: ubuntu-24.04 }
          - { target: bun-linux-arm64, asset: linux-arm64, os: ubuntu-24.04-arm }
          - { target: bun-windows-x64, asset: win-x64, os: windows-2025, exe: .exe }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: npm ci
      - run: npm run build
      - name: Compile the native artifact
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          bun packaging/build-binary.mjs --target "$TARGET"
          echo "BUILT=packaging/dist/calliope-${TARGET#bun-}$EXE" >> "$GITHUB_ENV"
      # macOS binaries are signed and notarised before the smoke test, checksum and
      # attestation, so all three cover the bytes that ship. A release never ships
      # them unsigned; a manual preview without the org secrets builds unsigned.
      - name: Require signing credentials for a macOS release
        id: signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = release ]; then
            echo "::error title=Unsigned macOS release::CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are required to publish macOS binaries."
            exit 1
          else
            echo "::warning title=Unsigned macOS preview::Signing secrets are unavailable to this run; the preview binary is neither signed nor notarised."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign the macOS binary with the hardened runtime
        if: steps.signing.outputs.sign == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/calliope-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/calliope-signing.p12"
          security import "$RUNNER_TEMP/calliope-signing.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/calliope-signing.p12"
          curl -fsSL --proto '=https' --proto-redir '=https' https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error title=No signing identity::CSC_LINK holds no Developer ID Application certificate."
            exit 1
          fi
          # Bun's runtime entitlements: without them the hardened runtime silently disables the JIT.
          codesign --force --timestamp --options runtime --entitlements packaging/entitlements.plist \
            --identifier ai.calliope.cli --keychain "$keychain" --sign "$identity" "$BUILT"
          codesign --verify --strict --verbose=2 "$BUILT"
          codesign --display --verbose=2 "$BUILT"
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.sign == 'true'
        run: security delete-keychain "$RUNNER_TEMP/calliope-signing.keychain-db"
      - name: Notarise the macOS binary
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A bare Mach-O cannot be stapled; Gatekeeper checks the ticket online.
          archive="$RUNNER_TEMP/calliope-notarise.zip"
          result="$RUNNER_TEMP/calliope-notarise.json"
          ditto -c -k --keepParent "$BUILT" "$archive"
          xcrun notarytool submit "$archive" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json > "$result" || true
          status="$(jq -r '.status // empty' "$result" 2> /dev/null || true)"
          if [ "$status" != Accepted ]; then
            echo "::error title=Notarisation failed::Apple returned status '${status:-none}'."
            id="$(jq -r '.id // empty' "$result" 2> /dev/null || true)"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
            fi
            exit 1
          fi
          echo "Notarised: $(jq -r '.id' "$result")"
      - name: Smoke-test and stage the bytes that ship
        env:
          ASSET: ${{ matrix.asset }}
          EXE: ${{ matrix.exe }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          node scripts/release/binary-smoke.mjs "$BUILT" "$VERSION"
          mkdir out
          cp "$BUILT" "out/calliope-$VERSION-$ASSET$EXE"
          node scripts/release/checksum.mjs "out/calliope-$VERSION-$ASSET$EXE"
      - name: Attest the binary
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/calliope-${{ needs.checks.outputs.version }}-${{ matrix.asset }}${{ matrix.exe }}
      - name: Retain and verify the signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ASSET: ${{ matrix.asset }}
          EXE: ${{ matrix.exe }}
          VERSION: ${{ needs.checks.outputs.version }}
          SOURCE_REF: ${{ needs.checks.outputs.ref }}
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        run: |
          file="out/calliope-$VERSION-$ASSET$EXE"
          cp "$BUNDLE" "$file.sigstore.json"
          gh attestation verify "$file" --bundle "$file.sigstore.json" --repo calliopeai/calliope-cli \
            --cert-identity "https://github.com/calliopeai/calliope-cli/.github/workflows/release-binaries.yml@$SOURCE_REF" \
            --source-ref "$SOURCE_REF" --source-digest "$SOURCE_SHA" --deny-self-hosted-runners
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: out
          merge-multiple: true
      - name: Validate all five artifacts and assemble the manifests
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ needs.checks.outputs.ref }}
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        run: node scripts/release/assemble.mjs out "$VERSION"
      - name: Attest the complete checksum manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/checksums.txt
      - name: Attest the embedder manifest
        id: attest-binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/calliope-binaries.json
      - name: Retain and verify manifest provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKSUMS_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          BINARIES_BUNDLE: ${{ steps.attest-binaries.outputs.bundle-path }}
          SOURCE_REF: ${{ needs.checks.outputs.ref }}
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        run: |
          cp "$CHECKSUMS_BUNDLE" out/checksums.txt.sigstore.json
          cp "$BINARIES_BUNDLE" out/calliope-binaries.json.sigstore.json
          for manifest in out/checksums.txt out/calliope-binaries.json; do
            gh attestation verify "$manifest" --bundle "$manifest.sigstore.json" --repo calliopeai/calliope-cli \
              --cert-identity "https://github.com/calliopeai/calliope-cli/.github/workflows/release-binaries.yml@$SOURCE_REF" \
              --source-ref "$SOURCE_REF" --source-digest "$SOURCE_SHA" --deny-self-hosted-runners
          done
      - name: Retain the verified CI artifact set
        uses: actions/upload-artifact@v4
        with:
          name: verified-binaries-${{ needs.checks.outputs.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - name: Attach only after every artifact passed
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: gh release upload "$TAG" out/* --repo calliopeai/calliope-cli
